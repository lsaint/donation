<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Support Ethan's Open Source Projects</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding: 10px;
        margin: 0;
        background-color: #f4f7f6;
        color: #333;
      }
      .container {
        max-width: 900px; /* Increased max-width for more horizontal space */
        margin: 10px auto;
        background-color: #ffffff;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        padding: 20px;
        position: relative;
      }
      .header {
        display: flex;
        justify-content: flex-end;
        width: 100%;
        margin-bottom: 10px;
        position: absolute;
        top: 10px;
        right: 10px;
      }
      .language-toggle {
        color: #6b7f99;
        background: none;
        border: none;
        padding: 0;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        user-select: none;
      }
      .language-toggle:hover {
        color: #5a6d86;
      }
      h1 {
        color: #2c3e50;
        margin-top: 10px;
        font-size: 1.2em;
      }
      p {
        font-size: 1em;
        line-height: 1.5;
        color: #555;
      }
      hr {
        display: none; /* Hide hr for a more compact layout */
      }
      h2 {
        color: #34495e;
        margin-top: 20px;
        font-size: 1.5em;
      }
      .payment-options-wrapper {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 20px;
        margin-top: 20px;
      }
      .payment-option {
        flex: 1; /* Allow items to grow and shrink */
        min-width: 200px; /* Adjusted minimum width */
        background-color: #f9f9f9;
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .payment-option:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
      }
      .payment-option .qr-code {
        width: 120px;
        height: 120px;
        display: block;
        margin: 10px auto;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #fff;
      }
      .paypal-link {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-decoration: none;
        color: inherit;
      }
      .paypal-link p {
        color: #555;
      }
      .paypal-icon {
        fill: currentColor;
      }
      .title-icon {
        width: 1em;
        height: 1em;
        margin-right: 8px;
        vertical-align: -0.125em;
      }
      .large-paypal-icon {
        width: 120px;
        height: 120px;
        display: block;
        color: #333;
        margin: 10px auto; /* Center the large icon */
        padding: 10px;
        box-sizing: border-box;
        border: 1px solid #ddd; /* Add border */
        border-radius: 5px; /* Add border-radius */
        background-color: #fff;
      }
      .payment-option h3 {
        margin-bottom: 0px; /* Standardize margin below title */
      }
      .payment-option h3 {
        margin-bottom: 0px; /* User requested 0px margin below title */
      }
      .payment-option p {
        margin-top: 0px; /* Standardize margin above description text */
      }
      /* Responsive adjustments */
      @media (max-width: 768px) {
        .payment-option {
          flex: 0 0 calc(50% - 30px); /* 2 items per row on tablets */
        }
        .header {
          position: static; /* Remove absolute positioning on smaller screens */
          justify-content: center;
          margin-bottom: 20px;
        }
      }
      @media (max-width: 480px) {
        .payment-option {
          flex: 0 0 100%; /* 1 item per row on mobile */
        }
        h1 {
          font-size: 2em;
        }
        h2 {
          font-size: 1.5em;
        }
        .language-toggle {
          margin-top: 10px;
        }
      }
    </style>

      const languageToggle = document.getElementById("languageToggle");
      let currentLang = languageToggle.dataset.lang; // 'en' by default

      function updateLanguageToggleDisplay() {
        const targetLang = currentLang === "en" ? "zh" : "en";
        languageToggle.innerHTML =
          targetLang === "zh" ? "<strong>中</strong>/EN" : "中/<strong>EN</strong>";

      function updateContent(lang) {
        document.getElementById("pageTitle").textContent =
          langData[lang].pageTitle;

          langData[lang].paypalTitle;

          langData[lang].alipayTitle;

          langData[lang].alipayDesc;

        // Optional: Update WeChat Pay if it exists

          document.getElementById("wechatPayTitleText").textContent =
            langData[lang].wechatPayTitle;
          document.getElementById("wechatPayDesc").textContent =
            langData[lang].wechatPayDesc;
        }

        // Update document lang attribute
        document.documentElement.lang = lang;
        updateLanguageToggleDisplay();

      languageToggle.addEventListener("click", () => {
        currentLang = currentLang === "en" ? "zh" : "en";
